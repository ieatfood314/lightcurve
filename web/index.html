<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>lightcurve</title>
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#000000">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preload" href="fonts/archivo.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/gloock.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="style.css">
<script>
  // Dark or light, before the first paint.
  (function () {
    var t = localStorage.getItem("lightcurve-theme");
    if (t === "sky" || t === "plate") document.documentElement.dataset.theme = t;
  })();
</script>
</head>
<body>
<header class="bar">

    <span>lightcurve</span>
  </a>
  <nav class="tabs" aria-label="Views">
    <button type="button" data-view="day">Day</button>
    <button type="button" data-view="weeks">Weeks</button>
    <button type="button" data-view="apps">Apps</button>
    <button type="button" data-view="burns">Burns</button>
  </nav>
  <div class="tools">
    <button type="button" class="icon" data-view="devices" aria-label="Devices" title="Devices">
      <svg viewBox="0 0 20 20" width="20" height="20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><rect x="2" y="4" width="11" height="8" rx="1.2"/><path d="M5 15h5" stroke-linecap="round"/><rect x="14.5" y="7" width="4" height="9" rx="1"/></svg>
    </button>
    <button id="theme" type="button" class="icon" aria-label="Dark or light" title="Dark or light">
      <svg viewBox="0 0 20 20" width="20" height="20" aria-hidden="true"><circle cx="10" cy="10" r="7" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M10 3a7 7 0 0 1 0 14z" fill="currentColor"/></svg>
    </button>
  </div>
</header>

<main>
  <section id="v-day" class="view" aria-live="polite">
    <nav class="when" aria-label="Day">
      <button id="prev" type="button" aria-label="Day before">
        <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M10 3 5 8l5 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button id="pick" type="button" class="date" aria-label="Pick a day"><span id="date-label">Today</span></button>
      <input id="date-input" type="date" tabindex="-1" aria-hidden="true">
      <button id="next" type="button" aria-label="Day after">
        <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="m6 3 5 5-5 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button id="today" type="button" class="quiet" hidden>Today</button>
    </nav>
    <p class="figure"><span class="num" id="lit">&nbsp;</span><span class="versus" id="versus"></span></p>
    <div class="who-row" role="group" aria-label="Device"></div>
    <div id="notes" class="notes"></div>
    <figure id="day-figure">
      <div id="curve" class="plot" role="img" aria-label="Screen time by hour"></div>
      <div id="legend" class="legend"></div>
    </figure>
    <dl id="stats" class="stats"></dl>
    <ol id="things" class="things"></ol>
    <button type="button" id="more-things" class="quiet more" hidden></button>
  </section>

  <section id="v-weeks" class="view" hidden>
    <div class="seg" role="group" aria-label="Range"></div>
    <p class="figure"><span class="num" id="avg">&nbsp;</span><span class="versus">a day</span></p>
    <div class="who-row" role="group" aria-label="Device"></div>
    <div id="record" class="record"></div>
    <div id="weeks-legend" class="legend"></div>
  </section>

  <section id="v-apps" class="view" hidden>
    <div class="seg" role="group" aria-label="Range"></div>
    <p class="figure"><span class="num" id="apps-total">&nbsp;</span><span class="versus" id="apps-count"></span></p>
    <div class="who-row" role="group" aria-label="Device"></div>
    <div id="apps-split"></div>
    <ol id="apps-list" class="things"></ol>
    <button type="button" id="more-apps" class="quiet more" hidden></button>
  </section>

  <section id="v-burns" class="view" hidden>
    <div class="seg" role="group" aria-label="Range"></div>
    <div class="who-row" role="group" aria-label="Device"></div>
    <div id="burns"></div>
  </section>

  <section id="v-devices" class="view" hidden>
    <div id="devices"></div>
  </section>
</main>

<div id="tip" class="tip" role="status" hidden></div>
<div id="sheet" class="sheet" hidden></div>
<script src="app.js"></script>
</body>
</html>
